{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<h1>Log In</h1>
{% if form.errors %}
  <p role="alert">That username and password didn't match. Try again.</p>
{% endif %}
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  <p>
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autocapitalize="none"
           spellcheck="false" required autofocus value="{{ form.username.value|default:'' }}">
  </p>
  <p>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
  </p>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log In</button>
</form>
<p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
{% endblock %}
