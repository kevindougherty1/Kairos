{% if choices %}
<fieldset class="field choices">
  <legend class="field__label">{{ field.label }}</legend>
  {% for option in field %}<label class="choice" for="{{ option.id_for_label }}">{{ option.tag }} {{ option.choice_label }}</label>{% endfor %}
  {{ field.errors }}
</fieldset>
{% else %}
<div class="field">
  {{ field.label_tag }} {{ field }}
  {% if field.help_text %}<span class="field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
{% endif %}
